<div class="pointer-events-none fixed bottom-0 z-20 flex w-screen flex-col">
  <div class="flex justify-end p-4">
    <div class="slide-up pointer-events-auto flex flex-col items-end gap-4" [hidden]="!isOpen()">
      <button pButton (click)="onPress('despesa')" data-cy="btn-acao-despesa">
        <svg lucideReceiptText></svg>
        Adicionar Despesa
      </button>
      <span pButton (click)="onPress('receita')" data-cy="btn-acao-receita">
        <svg lucideCircleDollarSign></svg>
        Adicionar Receita
      </span>
      <span pButton (click)="onPress('extrato')" data-cy="btn-acao-extrato">
        <svg lucideFileUp></svg>
        Importar Extrato
      </span>
    </div>
  </div>
  <div class="flex justify-end p-4 pt-0">
    <button
      pButton
      rounded="true"
      severity="primary"
      class="pointer-events-auto"
      data-cy="btn-dashboard-acoes"
      (click)="onToggle()"
    >
      <svg
        pButtonIcon
        lucidePlus
        class="transition-transform"
        [class]="[isOpen() && 'rotate-45']"
      ></svg>
    </button>
  </div>
  <div class="h-nav-bottom"></div>
</div>

<div
  class="fade-in fixed inset-0 z-10 bg-black/20"
  [hidden]="!isOpen()"
  (click)="isOpen.set(false)"
></div>
